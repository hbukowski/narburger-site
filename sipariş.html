<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Narburger Sipariş Paneli</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

.hidden{display:none!important}

/* GİRİŞ */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:390px;
  background:#151515;
  border:1px solid #292929;
  border-radius:22px;
  padding:32px;
  text-align:center;
}

.loginBox img{
  max-width:220px;
  max-height:90px;
  margin-bottom:20px;
}

.loginBox h2{
  margin:5px 0 25px;
}

.loginBox input{
  width:100%;
  padding:15px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#0c0c0c;
  color:white;
  font-size:16px;
}

.loginButton{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#e52b32;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#error{
  color:#ff6b6b;
  margin-top:15px;
}

/* PANEL */

header{
  background:#000;
  border-bottom:1px solid #292929;
  padding:15px 22px;
  position:sticky;
  top:0;
  z-index:20;
}

.headerInner{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

header img{
  height:55px;
  max-width:220px;
  object-fit:contain;
}

.headerRight{
  display:flex;
  align-items:center;
  gap:10px;
}

.online{
  background:#12391d;
  color:#72ef91;
  padding:9px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
}

.logout{
  border:1px solid #444;
  background:#1b1b1b;
  color:#fff;
  padding:9px 13px;
  border-radius:9px;
  cursor:pointer;
}

main{
  max-width:1400px;
  margin:auto;
  padding:28px 20px;
}

h1{
  margin:0;
  font-size:31px;
}

.subtitle{
  color:#999;
  margin:7px 0 25px;
}

#orders{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:18px;
}

.order{
  background:#151515;
  border:1px solid #292929;
  border-radius:18px;
  overflow:hidden;
}

.order.new{border-top:5px solid #e52b32}
.order.preparing{border-top:5px solid #f0ad26}
.order.delivery{border-top:5px solid #278bea}
.order.completed{border-top:5px solid #2ab557;opacity:.82}
.order.cancelled{opacity:.55}

.orderHead{
  padding:17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #292929;
}

.orderNo{
  font-size:20px;
  font-weight:900;
}

.time{
  color:#999;
  font-size:12px;
  margin-top:4px;
}

.badge{
  background:#e52b32;
  padding:7px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.orderBody{
  padding:18px;
}

.customer{
  font-size:20px;
  font-weight:900;
  margin-bottom:10px;
}

.info{
  color:#ccc;
  line-height:1.65;
}

.items{
  background:#0b0b0b;
  border-radius:12px;
  padding:12px;
  margin:16px 0;
}

.item{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0;
  border-bottom:1px solid #222;
}

.item:last-child{border-bottom:0}

.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:900;
  margin:16px 0;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.actions button{
  border:0;
  border-radius:10px;
  padding:12px 6px;
  cursor:pointer;
  font-weight:bold;
}

.prepare{background:#f0ad26;color:#111}
.road{background:#278bea;color:white}
.done{background:#2ab557;color:white}
.cancel{background:#333;color:white}

.empty{
  grid-column:1/-1;
  background:#151515;
  padding:50px 20px;
  border-radius:18px;
  text-align:center;
  color:#aaa;
}

@media(max-width:600px){
  header img{height:42px}
  .online{display:none}
  main{padding:20px 12px}
  #orders{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="loginScreen">
  <div class="loginBox">

    <img src="logo-full.png" alt="Narburger">

    <h2>Sipariş Yönetimi</h2>

    <input
      id="email"
      type="email"
      placeholder="E-posta">

    <input
      id="password"
      type="password"
      placeholder="Şifre">

    <button
      class="loginButton"
      onclick="login()">
      Giriş Yap
    </button>

    <div id="error"></div>

  </div>
</div>


<div id="panel" class="hidden">

<header>
  <div class="headerInner">

    <img src="logo-full.png" alt="Narburger">

    <div class="headerRight">

      <div class="online">
        ● SİPARİŞ SİSTEMİ AÇIK
      </div>

      <button class="logout" onclick="logout()">
        Çıkış
      </button>

    </div>
  </div>
</header>

<main>

  <h1>🍔 Siparişler</h1>

  <div class="subtitle">
    Narburger Sipariş Yönetim Paneli
  </div>

  <div id="orders">
    <div class="empty">
      Siparişler yükleniyor...
    </div>
  </div>

</main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ffztqlyodruwcjtsyekj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m6pYevfC1_i_-df0rADYKQ_HT27Yc1e";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let knownOrders = new Set();
let firstLoad = true;
let soundReady = false;


/* ZİL */

function enableSound(){

  if(soundReady) return;

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx = new AudioContext();

    if(ctx.state === "suspended"){
      ctx.resume();
    }

    ctx.close();

    soundReady = true;

  }catch(e){}

}

document.addEventListener(
  "click",
  enableSound,
  {once:true}
);

function ring(){

  if(!soundReady) return;

  try{

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;

    const ctx = new AudioContext();

    function tone(freq,start,duration){

      const oscillator =
        ctx.createOscillator();

      const gain =
        ctx.createGain();

      oscillator.connect(gain);
      gain.connect(ctx.destination);

      oscillator.frequency.value = freq;

      gain.gain.setValueAtTime(
        0.001,
        ctx.currentTime + start
      );

      gain.gain.exponentialRampToValueAtTime(
        0.35,
        ctx.currentTime + start + 0.02
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + start + duration
      );

      oscillator.start(
        ctx.currentTime + start
      );

      oscillator.stop(
        ctx.currentTime + start + duration
      );
    }

    tone(880,0,.35);
    tone(1100,.42,.35);
    tone(880,.84,.45);

  }catch(e){}

}


/* GİRİŞ */

async function login(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const errorBox =
    document.getElementById("error");

  errorBox.textContent = "";

  if(!email || !password){

    errorBox.textContent =
      "E-posta ve şifreyi gir.";

    return;
  }

  const {error} =
    await db.auth.signInWithPassword({
      email:email,
      password:password
    });

  if(error){

    errorBox.textContent =
      "Giriş başarısız. E-posta veya şifreyi kontrol et.";

    return;
  }

  soundReady = true;

  showPanel();

}


/* ÇIKIŞ */

async function logout(){

  await db.auth.signOut();

  document
    .getElementById("panel")
    .classList.add("hidden");

  document
    .getElementById("loginScreen")
    .classList.remove("hidden");

}


/* PANEL */

function showPanel(){

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("panel")
    .classList.remove("hidden");

  loadOrders();

}


/* GÜVENLİ METİN */

function esc(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* ÜRÜNLER */

function parseItems(value){

  if(Array.isArray(value)){
    return value;
  }

  if(typeof value === "string"){

    try{

      const parsed =
        JSON.parse(value);

      if(Array.isArray(parsed)){
        return parsed;
      }

    }catch(e){}

  }

  return [];

}


function itemHtml(value){

  const items =
    parseItems(value);

  if(!items.length){

    return `
      <div class="item">
        Ürün bilgisi bulunamadı
      </div>
    `;

  }

  return items.map(item=>{

    const qty =
      Number(item.qty || 1);

    const price =
      Number(item.price || 0);

    return `
      <div class="item">

        <span>
          ${qty} × ${esc(item.name || "Ürün")}
        </span>

        <strong>
          ${qty * price}₺
        </strong>

      </div>
    `;

  }).join("");

}


/* DURUM */

function statusName(status){

  if(status === "preparing")
    return "HAZIRLANIYOR";

  if(status === "delivery")
    return "YOLA ÇIKTI";

  if(status === "completed")
    return "TAMAMLANDI";

  if(status === "cancelled")
    return "İPTAL";

  return "YENİ SİPARİŞ";

}


/* TARİH */

function orderTime(value){

  if(!value) return "";

  const d =
    new Date(value);

  if(Number.isNaN(d.getTime()))
    return "";

  return d.toLocaleString(
    "tr-TR",
    {
      day:"2-digit",
      month:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* SİPARİŞLERİ GETİR */

async function loadOrders(){

  const {data,error} =
    await db
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  const box =
    document.getElementById("orders");

  if(error){

    box.innerHTML =
      `<div class="empty">
        Siparişler yüklenemedi.<br><br>
        ${esc(error.message)}
      </div>`;

    return;
  }


  if(!data || !data.length){

    box.innerHTML =
      `<div class="empty">
        Henüz sipariş yok.
      </div>`;

    return;
  }


  if(!firstLoad){

    let newOrder = false;

    data.forEach(order=>{

      if(
        !knownOrders.has(
          String(order.id)
        )
      ){
        newOrder = true;
      }

    });

    if(newOrder){
      ring();
    }

  }


  knownOrders =
    new Set(
      data.map(
        order=>String(order.id)
      )
    );

  firstLoad = false;


  box.innerHTML =
    data.map(order=>{

      const status =
        order.status || "new";

      return `

      <div class="order ${status}">

        <div class="orderHead">

          <div>

            <div class="orderNo">
              Sipariş #${esc(order.id)}
            </div>

            <div class="time">
              ${orderTime(order.created_at)}
            </div>

          </div>

          <div class="badge">
            ${statusName(status)}
          </div>

        </div>


        <div class="orderBody">

          <div class="customer">
            👤 ${esc(order.customer_name || "-")}
          </div>

          <div class="info">

            📞 ${esc(order.phone || "-")}
            <br>

            📍 ${esc(order.address || "-")}
            <br>

            💳 ${esc(order.payment || "-")}

          </div>


          <div class="items">
            ${itemHtml(order.items)}
          </div>


          <div class="total">

            <span>TOPLAM</span>

            <span>
              ${Number(order.total || 0)}₺
            </span>

          </div>


          <div class="actions">

            <button
              class="prepare"
              onclick="changeStatus('${order.id}','preparing')">
              Hazırlanıyor
            </button>

            <button
              class="road"
              onclick="changeStatus('${order.id}','delivery')">
              Yola Çıktı
            </button>

            <button
              class="done"
              onclick="changeStatus('${order.id}','completed')">
              Tamamlandı
            </button>

            <button
              class="cancel"
              onclick="changeStatus('${order.id}','cancelled')">
              İptal
            </button>

          </div>

        </div>

      </div>

      `;

    }).join("");

}


/* DURUM DEĞİŞTİR */

async function changeStatus(id,status){

  const {error} =
    await db
      .from("orders")
      .update({
        status:status
      })
      .eq("id",id);

  if(error){

    alert(
      "Durum değiştirilemedi: " +
      error.message
    );

    return;
  }

  loadOrders();

}


/* OTURUM KONTROLÜ */

async function start(){

  const {
    data:{session}
  } =
    await db.auth.getSession();

  if(session){

    showPanel();

  }else{

    document
      .getElementById("loginScreen")
      .classList.remove("hidden");

  }

}

start();


/* OTOMATİK YENİLE */

setInterval(
  async()=>{

    const {
      data:{session}
    } =
      await db.auth.getSession();

    if(session){
      loadOrders();
    }

  },
  5000
);

<!-- NARBURGER YÖNETİM PANELİ -->
<div id="yonetimPaneli" style="
  position:fixed;
  bottom:20px;
  right:20px;
  background:#151515;
  border:1px solid #333;
  border-radius:15px;
  padding:15px;
  color:white;
  z-index:9999;
">
  <b>⚙️ Sipariş Sistemi</b>
  <div style="margin-top:10px;">
    <button onclick="alert('AÇIK seçildi')">🟢 AÇIK</button>
    <button onclick="alert('YOĞUN seçildi')">🟠 YOĞUN</button>
    <button onclick="alert('KAPALI seçildi')">🔴 KAPALI</button>
  </div>
</div>
</body>
</html>
