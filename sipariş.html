<!DOCTYPE html>

</div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://ffztqlyodruwcjtsyekj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m6pYevfC1_i_-df0rADYKQ_HT27Yc1e";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadOrderStoreStatus(){

  const {data,error}=await db
    .from("store_status")
    .select("*")
    .eq("id",1)
    .single();

  if(error){

    console.error(error);

    return;

  }

  const status =
    document.getElementById(
      "orderStoreStatus"
    );

  if(data.is_open){

    status.innerHTML =
      "🟢 SİPARİŞ SİSTEMİ AÇIK";

    status.style.background =
      "#19a75a";

  }else{

    status.innerHTML =
      "🔴 SİPARİŞ SİSTEMİ KAPALI";

    status.style.background =
      "#e51d48";

  }

}


async function toggleOrderStoreStatus(){

  const {data,error}=await db
    .from("store_status")
    .select("*")
    .eq("id",1)
    .single();

  if(error){

    alert(error.message);

    return;

  }

  const newStatus =
    !data.is_open;

  const result=await db
    .from("store_status")
    .update({

      is_open:newStatus,

      message:newStatus
        ? "Sipariş sistemi açık"
        : "Şu anda sipariş alamıyoruz."

    })
    .eq("id",1);

  if(result.error){

    alert(result.error.message);

    return;

  }

  await loadOrderStoreStatus();

}


async function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const errorBox =
    document
      .getElementById("error");

  errorBox.textContent = "";

  if(!email || !password){

    errorBox.textContent =
      "E-posta ve şifreyi gir.";

    return;

  }

  const {error} =
    await db.auth
      .signInWithPassword({

        email:email,
        password:password

      });

  if(error){

    errorBox.textContent =
      "Giriş başarısız: "
      + error.message;

    return;

  }

  showPanel();

}


async function logout(){

  await db.auth.signOut();

  document
    .getElementById("panel")
    .classList
    .add("hidden");

  document
    .getElementById("loginScreen")
    .classList
    .remove("hidden");

}


function showPanel(){

  document
    .getElementById("loginScreen")
    .classList
    .add("hidden");

  document
    .getElementById("panel")
    .classList
    .remove("hidden");

  loadOrders();

}


function esc(value){

  const div =
    document.createElement("div");

  div.textContent =
    value ?? "";

  return div.innerHTML;

}


function showItems(items){

  if(!items){

    return "-";

  }

  if(typeof items === "string"){

    try{

      items =
        JSON.parse(items);

    }catch(e){

      return esc(items);

    }

  }

  if(Array.isArray(items)){

    return items
      .map(item=>{

        const name =
          item.name ||
          item.product ||
          item.title ||
          "Ürün";

        const qty =
          item.quantity ||
          item.qty ||
          item.adet ||
          1;

        const price =
          item.price ?? "";

        return `
          ${esc(qty)}
          x
          ${esc(name)}
          ${
            price !== ""
            ? "- "+esc(price)+"₺"
            : ""
          }
        `;

      })
      .join("<br>");

  }

  return esc(
    JSON.stringify(items)
  );

}


async function loadOrders(){

  const box =
    document.getElementById(
      "orders"
    );

  const {data,error}=
    await db
      .from("orders")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(error){

    box.innerHTML = `
      <div class="empty">

        Siparişler yüklenemedi.

        <br>

        ${esc(error.message)}

      </div>
    `;

    return;

  }

  if(!data || !data.length){

    box.innerHTML = `
      <div class="empty">
        Henüz sipariş yok.
      </div>
    `;

    return;

  }

  box.innerHTML =
    data
    .map(order=>{

      const date =
        order.created_at

        ? new Date(
            order.created_at
          )
          .toLocaleString(
            "tr-TR"
          )

        : "";

      return `

        <div class="order">

          <h2>
            Sipariş #${esc(order.id)}
          </h2>


          <div class="info">

            <b>Müşteri:</b>

            ${esc(
              order.customer_name
              || "-"
            )}

            <br>


            <b>Telefon:</b>

            ${esc(
              order.phone
              || "-"
            )}

            <br>


            <b>Adres:</b>

            ${esc(
              order.address
              || "-"
            )}

            <br>


            <b>Sipariş Notu:</b>

            ${esc(
              order.note
              || "-"
            )}

            <br>


            <b>Ödeme:</b>

            ${esc(
              order.payment
              || "-"
            )}

            <br>


            <b>Tarih:</b>

            ${esc(date)}

          </div>


          <div class="items">

            ${showItems(
              order.items
            )}

          </div>


          <div class="total">

            Toplam:

            ${esc(
              order.total || 0
            )}

            ₺

          </div>


          <div>

            Durum:

            <b>
              ${esc(
                order.status
                || "Yeni"
              )}
            </b>

          </div>


          <br>


          <div class="actions">


            <button
              class="preparing"
              onclick="
              changeStatus(
                '${order.id}',
                'Hazırlanıyor'
              )
              "
            >
              Hazırlanıyor
            </button>


            <button
              class="road"
              onclick="
              changeStatus(
                '${order.id}',
                'Yola Çıktı'
              )
              "
            >
              Yola Çıktı
            </button>


            <button
              class="done"
              onclick="
              changeStatus(
                '${order.id}',
                'Tamamlandı'
              )
              "
            >
              Tamamlandı
            </button>


            <button
              class="cancel"
              onclick="
              changeStatus(
                '${order.id}',
                'İptal'
              )
              "
            >
              İptal
            </button>


            <button
              class="cancel"
              onclick="
              deleteOrder(
                '${order.id}'
              )
              "
            >
              SİL
            </button>


            <button
              class="print"
              onclick="
              printOrder(
                '${order.id}'
              )
              "
            >
              FİŞ YAZDIR
            </button>


          </div>

        </div>

      `;

    })
    .join("");

}

async function changeStatus(
  id,
  status
){

  const {error}=
    await db
      .from("orders")
      .update({
        status:status
      })
      .eq(
        "id",
        id
      );

  if(error){

    alert(
      "Durum değiştirilemedi: "
      + error.message
    );

    return;

  }

  loadOrders();

}


async function deleteOrder(id){

  if(
    !confirm(
      "Bu siparişi kalıcı olarak silmek istiyor musunuz?"
    )
  ){

    return;

  }

  const {error}=
    await db
      .from("orders")
      .delete()
      .eq(
        "id",
        id
      );

  if(error){

    alert(
      "Sipariş silinemedi: "
      + error.message
    );

    return;

  }

  await loadOrders();

}


async function start(){

  const {
    data:{
      session
    }
  }=
    await db.auth
      .getSession();

  if(session){

    showPanel();

}


start();
