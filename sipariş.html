<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Narburger Sipariş Paneli</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:#000;
  border-bottom:1px solid #292929;
  padding:18px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
}

header img{
  height:55px;
}

.status{
  background:#163d22;
  color:#7dff9d;
  padding:9px 15px;
  border-radius:25px;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 20px;
}

h1{
  margin:0 0 5px;
  font-size:32px;
}

.subtitle{
  color:#999;
  margin-bottom:30px;
}

#orders{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}

.order{
  background:#161616;
  border:1px solid #292929;
  border-radius:20px;
  padding:22px;
}

.order.new{
  border:2px solid #e52b32;
}

.orderTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #333;
  padding-bottom:15px;
  margin-bottom:15px;
}

.orderNumber{
  font-size:21px;
  font-weight:900;
}

.badge{
  background:#e52b32;
  padding:7px 11px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.customer{
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.info{
  color:#ccc;
  line-height:1.6;
}

.products{
  background:#0d0d0d;
  padding:15px;
  border-radius:12px;
  margin:17px 0;
}

.product{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
}

.total{
  font-size:25px;
  font-weight:900;
  color:#fff;
  text-align:right;
  margin:15px 0;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

button{
  border:0;
  padding:12px 8px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  font-size:14px;
}

.preparing{
  background:#f1b933;
  color:#111;
}

.delivery{
  background:#2386df;
  color:white;
}

.completed{
  background:#28a745;
  color:white;
}

.cancel{
  background:#333;
  color:#ddd;
}

.empty{
  padding:50px;
  text-align:center;
  background:#151515;
  border-radius:20px;
  color:#999;
  grid-column:1/-1;
}

@media(max-width:600px){
  header img{
    height:42px;
  }

  .container{
    padding:20px 12px;
  }

  h1{
    font-size:26px;
  }

  #orders{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <img src="logo-full.png" alt="Narburger">
  <div class="status">● SİPARİŞ SİSTEMİ AÇIK</div>
</header>

<div class="container">

  <h1>🍔 Siparişler</h1>
  <div class="subtitle">Narburger Sipariş Yönetim Paneli</div>

  <div id="orders">
    <div class="empty">Siparişler yükleniyor...</div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ffztqlyodruwcjtsyekj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m6pYevfC1_i_-df0rADYKQ_HT27Yc1e";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function productHTML(items){

  if(typeof items === "string"){
    try{
      items = JSON.parse(items);
    }catch(e){
      return `<div>${escapeHtml(items)}</div>`;
    }
  }

  if(!Array.isArray(items)){
    return "<div>Ürün bilgisi yok</div>";
  }

  return items.map(item => {

    const name = escapeHtml(item.name || "Ürün");
    const qty = Number(item.qty || 1);
    const price = Number(item.price || 0);

    return `
      <div class="product">
        <span>${qty} × ${name}</span>
        <strong>${price * qty}₺</strong>
      </div>
    `;

  }).join("");
}

function statusText(status){

  if(status === "preparing") return "HAZIRLANIYOR";
  if(status === "delivery") return "YOLA ÇIKTI";
  if(status === "completed") return "TAMAMLANDI";
  if(status === "cancelled") return "İPTAL";

  return "YENİ SİPARİŞ";
}

async function loadOrders(){

  const { data, error } =
  await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at", { ascending:false });

  const box =
  document.getElementById("orders");

  if(error){

    console.error(error);

    box.innerHTML =
    `<div class="empty">
      Siparişler yüklenemedi.<br><br>
      ${escapeHtml(error.message)}
    </div>`;

    return;
  }

  if(!data || !data.length){

    box.innerHTML =
    `<div class="empty">
      Henüz sipariş yok.
    </div>`;

    return;
  }

  box.innerHTML =
  data.map(order => {

    const status =
      order.status || "new";

    return `

    <div class="order ${status === "new" ? "new" : ""}">

      <div class="orderTop">

        <div class="orderNumber">
          Sipariş #${order.id}
        </div>

        <div class="badge">
          ${statusText(status)}
        </div>

      </div>

      <div class="customer">
        👤 ${escapeHtml(order.customer_name || "-")}
      </div>

      <div class="info">

        📞 ${escapeHtml(order.phone || "-")}
        <br>

        📍 ${escapeHtml(order.address || "-")}

        <br>

        💳 ${escapeHtml(order.payment || "-")}

      </div>

      <div class="products">

        ${productHTML(order.items)}

      </div>

      <div class="total">
        Toplam: ${Number(order.total || 0)}₺
      </div>

      <div class="buttons">

        <button
        class="preparing"
        onclick="changeStatus('${order.id}','preparing')">
        Hazırlanıyor
        </button>

        <button
        class="delivery"
        onclick="changeStatus('${order.id}','delivery')">
        Yola Çıktı
        </button>

        <button
        class="completed"
        onclick="changeStatus('${order.id}','completed')">
        Tamamlandı
        </button>

        <button
        class="cancel"
        onclick="changeStatus('${order.id}','cancelled')">
        İptal
        </button>

      </div>

    </div>

    `;

  }).join("");

}

async function changeStatus(id,status){

  const { error } =
  await supabaseClient
    .from("orders")
    .update({
      status:status
    })
    .eq("id",id);

  if(error){

    alert(
      "Durum değiştirilemedi: " +
      error.message
    );

    return;
  }

  loadOrders();
}

/* Yeni siparişleri otomatik yenile */

supabaseClient
.channel("narburger-orders")
.on(
  "postgres_changes",
  {
    event:"*",
    schema:"public",
    table:"orders"
  },
  () => {
    loadOrders();
  }
)
.subscribe();

/* İlk açılış */

loadOrders();

/* Her 15 saniyede yedek yenileme */

setInterval(
  loadOrders,
  15000
);

</script>

</body>
</html>
