<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Narburger Sipariş Paneli</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:#000;
  border-bottom:3px solid #e52b33;
  padding:18px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:15px;
}

.logo img{
  height:55px;
}

.logo h1{
  margin:0;
  font-size:25px;
}

.online{
  background:#163d22;
  color:#6cff8d;
  padding:9px 15px;
  border-radius:20px;
  font-weight:bold;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:25px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.top h2{
  margin:0;
  font-size:30px;
}

.refresh{
  background:#e52b33;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:#161616;
  border:1px solid #292929;
  border-radius:14px;
  padding:18px;
}

.stat small{
  color:#aaa;
}

.stat strong{
  display:block;
  margin-top:8px;
  font-size:27px;
}

#orders{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
  gap:20px;
}

.order{
  background:#171717;
  border:1px solid #333;
  border-radius:18px;
  overflow:hidden;
}

.order.new{
  border:2px solid #e52b33;
}

.orderHeader{
  background:#222;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.orderHeader strong{
  font-size:20px;
}

.badge{
  background:#e52b33;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.orderBody{
  padding:18px;
}

.row{
  margin-bottom:13px;
}

.label{
  color:#999;
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:4px;
}

.value{
  font-size:16px;
  line-height:1.5;
  word-break:break-word;
}

.items{
  background:#0d0d0d;
  padding:12px;
  border-radius:10px;
}

.total{
  font-size:25px;
  color:#ff4048;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:70px 20px;
  grid-column:1/-1;
}

.error{
  background:#4b1115;
  padding:15px;
  border-radius:10px;
  grid-column:1/-1;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .top{
    align-items:flex-start;
    gap:15px;
    flex-direction:column;
  }

  #orders{
    grid-template-columns:1fr;
  }

  .logo h1{
    font-size:19px;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">
  <img src="logo-full.png" alt="Narburger">
  <h1>Sipariş Paneli</h1>
</div>

<div class="online">
● CANLI
</div>

</header>


<div class="container">

<div class="top">

<h2>🍔 Gelen Siparişler</h2>

<button class="refresh" onclick="loadOrders()">
Yenile
</button>

</div>


<div class="stats">

<div class="stat">
<small>Toplam Sipariş</small>
<strong id="totalOrders">0</strong>
</div>

<div class="stat">
<small>Yeni Sipariş</small>
<strong id="newOrders">0</strong>
</div>

<div class="stat">
<small>Son Güncelleme</small>
<strong id="lastUpdate">--:--</strong>
</div>

</div>


<div id="orders">

<div class="empty">
Siparişler yükleniyor...
</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://ffztqlyodruwcjtsyekj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m6pYevfC1_i_-df0rADYKQ_HT27Yc1e";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


function escapeHtml(value){

  if(value === null || value === undefined){
    return "-";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function formatItems(items){

  if(!items){
    return "-";
  }

  if(typeof items === "string"){
    try{
      items = JSON.parse(items);
    }catch(e){
      return escapeHtml(items);
    }
  }

  if(!Array.isArray(items)){
    return escapeHtml(JSON.stringify(items));
  }

  return items.map(item => {

    const name =
      escapeHtml(item.name || "Ürün");

    const qty =
      escapeHtml(item.qty || 1);

    const price =
      Number(item.price || 0);

    return `
      <div style="
        display:flex;
        justify-content:space-between;
        padding:6px 0;
        border-bottom:1px solid #222;
      ">
        <span>${qty} × ${name}</span>
        <span>${price * Number(item.qty || 1)}₺</span>
      </div>
    `;

  }).join("");

}


function formatDate(date){

  if(!date){
    return "-";
  }

  const d = new Date(date);

  return d.toLocaleString(
    "tr-TR",
    {
      day:"2-digit",
      month:"2-digit",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


async function loadOrders(){

  const ordersBox =
    document.getElementById("orders");

  const {data,error} =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at",{
        ascending:false
      });


  if(error){

    console.error(error);

    ordersBox.innerHTML =
    `<div class="error">
      Siparişler alınamadı:<br>
      ${escapeHtml(error.message)}
    </div>`;

    return;
  }


  document
    .getElementById("totalOrders")
    .textContent =
    data.length;


  const newCount =
    data.filter(order =>
      !order.status ||
      order.status === "new"
    ).length;


  document
    .getElementById("newOrders")
    .textContent =
    newCount;


  document
    .getElementById("lastUpdate")
    .textContent =
    new Date().toLocaleTimeString(
      "tr-TR",
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );


  if(!data.length){

    ordersBox.innerHTML =
    `<div class="empty">
      Henüz sipariş yok.
    </div>`;

    return;
  }


  ordersBox.innerHTML =
  data.map((order,index)=>{

    const status =
      order.status || "new";

    const total =
      Number(order.total || 0);

    return `

    <div class="order ${status === "new" ? "new" : ""}">

      <div class="orderHeader">

        <strong>
        Sipariş #${data.length-index}
        </strong>

        <span class="badge">
        ${status === "new" ? "YENİ" : escapeHtml(status)}
        </span>

      </div>


      <div class="orderBody">

        <div class="row">
          <div class="label">Sipariş Saati</div>
          <div class="value">
            ${formatDate(order.created_at)}
          </div>
        </div>


        <div class="row">
          <div class="label">Müşteri</div>
          <div class="value">
            <strong>
            ${escapeHtml(order.customer_name)}
            </strong>
          </div>
        </div>


        <div class="row">
          <div class="label">Telefon</div>
          <div class="value">
            ${escapeHtml(order.phone)}
          </div>
        </div>


        <div class="row">
          <div class="label">Adres</div>
          <div class="value">
            ${escapeHtml(order.address)}
          </div>
        </div>


        <div class="row">

          <div class="label">
          Ürünler
          </div>

          <div class="items">
          ${formatItems(order.items)}
          </div>

        </div>


        <div class="row">

          <div class="label">
          Ödeme
          </div>

          <div class="value">
          ${escapeHtml(order.payment)}
          </div>

        </div>


        <div class="row">

          <div class="label">
          Toplam
          </div>

          <div class="total">
          ${total}₺
          </div>

        </div>

      </div>

    </div>

    `;

  }).join("");

}


loadOrders();

setInterval(
  loadOrders,
  10000
);

</script>

</body>
</html>
