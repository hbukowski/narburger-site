<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Narburger Ürün Yönetimi</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#090909;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

h1{color:#ff234f}

.box{
  background:#151515;
  border:1px solid #333;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
}

input,select,textarea{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:9px;
  border:1px solid #444;
  background:#222;
  color:white;
  font-size:16px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
}

.add{
  width:100%;
  margin-top:10px;
  background:#e51d48;
  color:white;
}

.categoryAdd{
  background:white;
  color:#1674d1;
  margin-top:5px;
}

.product,
.categoryRow{
  display:flex;
  align-items:center;
  gap:15px;
  background:#151515;
  border:1px solid #333;
  padding:15px;
  margin:12px 0;
  border-radius:14px;
}

.product img{
  width:90px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
  background:#222;
}

.info{
  flex:1;
}

.info h3{
  margin:0 0 6px;
}

.description{
  margin-top:7px;
  color:#bbb;
  font-size:14px;
  line-height:1.4;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.move,.edit{
  background:#f0a500;
  color:#111;
}

.toggle{
  background:#19a75a;
  color:white;
}

.delete{
  background:#e51d48;
  color:white;
}

.off{
  opacity:.45;
}

.categoryName{
  flex:1;
  font-size:18px;
  font-weight:bold;
}

@media(max-width:650px){
  .product,
  .categoryRow{
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .product img{
    width:76px;
    height:60px;
  }

  .actions{
    width:100%;
  }

  .actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🍔 Narburger Ürün Yönetimi</h1>

<div class="box" style="text-align:center">

<h2 style="margin-top:0">Sipariş Sistemi</h2>

<button
id="storeStatusBtn"
onclick="toggleStoreStatus()"
style="
width:100%;
padding:18px;
font-size:20px;
background:#19a75a;
color:white;
">
🟢 AÇIK
</button>

</div>


<div class="box">

<h2>Kategori Yönetimi</h2>

<input
id="newCategory"
placeholder="Yeni kategori adı">

<button
class="categoryAdd"
onclick="addCategory()">
+ KATEGORİ EKLE
</button>

<div id="categories">
Kategoriler yükleniyor...
</div>

</div>


<div class="box">

<h2>Yeni Ürün Ekle</h2>

<input
id="name"
placeholder="Ürün adı">

<input
id="price"
type="number"
placeholder="Fiyat">

<select id="category"></select>

<textarea
id="description"
placeholder="Ürün içeriği / açıklaması
Örn: 100 gr dana köfte, marul, turşu, patates"></textarea>

<input
id="imageFile"
type="file"
accept="image/*">

<button
class="add"
onclick="addProduct()">
ÜRÜNÜ EKLE
</button>

</div>


<h2>Ürünler</h2>

<div id="products">
Ürünler yükleniyor...
</div>

</div>


<script>

const SUPABASE_URL =
"https://ffztqlyodruwcjtsyekj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_m6pYevfC1_i_-df0rADYKQ_HT27Yc1e";

const db = supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


// =====================
// MAĞAZA DURUMU
// =====================

async function loadStoreStatus(){

  const {data,error}=await db
  .from("store_status")
  .select("*")
  .eq("id",1)
  .single();

  if(error){
    console.error(error);
    return;
  }

  const btn=
  document.getElementById("storeStatusBtn");

  if(data.is_open){
    btn.innerHTML="🟢 AÇIK";
    btn.style.background="#19a75a";
  }else{
    btn.innerHTML="🔴 KAPALI";
    btn.style.background="#e51d48";
  }
}


async function toggleStoreStatus(){

  const {data,error}=await db
  .from("store_status")
  .select("*")
  .eq("id",1)
  .single();

  if(error){
    alert(error.message);
    return;
  }

  const newStatus=!data.is_open;

  const result=await db
  .from("store_status")
  .update({
    is_open:newStatus,
    message:newStatus
    ? "Sipariş sistemi açık"
    : "Şu anda sipariş alamıyoruz."
  })
  .eq("id",1);

  if(result.error){
    alert(result.error.message);
    return;
  }

  await loadStoreStatus();
}


// =====================
// KATEGORİLER
// =====================

async function loadCategories(){

  const {data,error}=await db
  .from("categories")
  .select("*")
  .order("sort_order",{
    ascending:true,
    nullsFirst:false
  })
  .order("id",{ascending:true});

  if(error){
    document.getElementById("categories")
    .textContent=
    "Kategoriler yüklenemedi: "+error.message;
    return;
  }

  const area=
  document.getElementById("categories");

  const select=
  document.getElementById("category");

  const oldSelection=select.value;

  area.innerHTML="";
  select.innerHTML="";

  if(!data || !data.length){
    area.innerHTML="Henüz kategori yok.";
    return;
  }

  data.forEach(c=>{

    if(c.active!==false){

      const option=
      document.createElement("option");

      option.value=c.name;
      option.textContent=c.name;

      select.appendChild(option);
    }


    const row=
    document.createElement("div");

    row.className="categoryRow";

    const name=
    document.createElement("div");

    name.className="categoryName";
    name.textContent=c.name;

    const actions=
    document.createElement("div");

    actions.className="actions";


    const up=
    document.createElement("button");

    up.className="move";
    up.textContent="↑";

    up.onclick=()=>{
      moveCategory(c.id,-1);
    };


    const down=
    document.createElement("button");

    down.className="move";
    down.textContent="↓";

    down.onclick=()=>{
      moveCategory(c.id,1);
    };


    const edit=
    document.createElement("button");

    edit.className="edit";
    edit.textContent="DÜZENLE";

    edit.onclick=()=>{
      editCategory(c);
    };


    const del=
    document.createElement("button");

    del.className="delete";
    del.textContent="SİL";

    del.onclick=()=>{
      deleteCategory(c);
    };


    actions.appendChild(up);
    actions.appendChild(down);
    actions.appendChild(edit);
    actions.appendChild(del);

    row.appendChild(name);
    row.appendChild(actions);

    area.appendChild(row);

  });


  if(
    oldSelection &&
    [...select.options].some(
      x=>x.value===oldSelection
    )
  ){
    select.value=oldSelection;
  }
}


async function addCategory(){

  const input=
  document.getElementById("newCategory");

  const name=input.value.trim();

  if(!name){
    alert("Kategori adı gir.");
    return;
  }

  const {data:existing}=await db
  .from("categories")
  .select("id")
  .eq("name",name)
  .limit(1);

  if(existing && existing.length){
    alert("Bu kategori zaten var.");
    return;
  }

  const {data:last}=await db
  .from("categories")
  .select("sort_order")
  .order("sort_order",{
    ascending:false,
    nullsFirst:false
  })
  .limit(1);

  let nextOrder=1;

  if(
    last &&
    last.length &&
    last[0].sort_order!==null
  ){
    nextOrder=
    Number(last[0].sort_order)+1;
  }

  const {error}=await db
  .from("categories")
  .insert({
    name:name,
    sort_order:nextOrder,
    active:true
  });

  if(error){
    alert(
      "Kategori eklenemedi: "+
      error.message
    );
    return;
  }

  input.value="";

  await loadCategories();
}


async function editCategory(c){

  const newName=
  prompt(
    "Kategori adı",
    c.name
  );

  if(
    newName===null ||
    !newName.trim()
  ){
    return;
  }

  const cleanName=
  newName.trim();

  if(cleanName===c.name){
    return;
  }

  const {data:existing}=await db
  .from("categories")
  .select("id")
  .eq("name",cleanName)
  .limit(1);

  if(existing && existing.length){
    alert("Bu kategori adı zaten var.");
    return;
  }

  const {error}=await db
  .from("categories")
  .update({
    name:cleanName
  })
  .eq("id",c.id);

  if(error){
    alert(
      "Kategori güncellenemedi: "+
      error.message
    );
    return;
  }

  const productUpdate=
  await db
  .from("products")
  .update({
    category:cleanName
  })
  .eq("category",c.name);

  if(productUpdate.error){
    alert(productUpdate.error.message);
    return;
  }

  await loadCategories();
  await loadProducts();
}


async function deleteCategory(c){

  const {count,error}=await db
  .from("products")
  .select("id",{
    count:"exact",
    head:true
  })
  .eq("category",c.name);

  if(error){
    alert(error.message);
    return;
  }

  if(count>0){
    alert(
      "Bu kategoride ürün var. Önce ürünlerin kategorisini değiştir."
    );
    return;
  }

  if(
    !confirm(
      c.name+
      " kategorisini silmek istiyor musun?"
    )
  ){
    return;
  }

  const result=await db
  .from("categories")
  .delete()
  .eq("id",c.id);

  if(result.error){
    alert(result.error.message);
    return;
  }

  await loadCategories();
}


async function moveCategory(id,direction){

  const {data,error}=await db
  .from("categories")
  .select("id,sort_order")
  .order("sort_order",{
    ascending:true,
    nullsFirst:false
  })
  .order("id",{ascending:true});

  if(error){
    alert(error.message);
    return;
  }

  const items=
  (data||[]).map(
    (x,i)=>({
      id:x.id,
      sort_order:i+1
    })
  );

  const i=
  items.findIndex(
    x=>x.id===id
  );

  const j=i+direction;

  if(
    i<0 ||
    j<0 ||
    j>=items.length
  ){
    return;
  }

  const temp=items[i];
  items[i]=items[j];
  items[j]=temp;

  for(
    let k=0;
    k<items.length;
    k++
  ){

    const r=await db
    .from("categories")
    .update({
      sort_order:k+1
    })
    .eq("id",items[k].id);

    if(r.error){
      alert(r.error.message);
      return;
    }
  }

  await loadCategories();
}


// =====================
// ÜRÜNLER
// =====================

async function loadProducts(){

  const {data,error}=await db
  .from("products")
  .select("*")
  .order("sort_order",{
    ascending:true,
    nullsFirst:false
  })
  .order("id",{ascending:true});

  if(error){

    document
    .getElementById("products")
    .textContent=
    "Ürünler yüklenemedi: "+
    error.message;

    return;
  }

  const area=
  document.getElementById("products");

  if(!data || !data.length){

    area.innerHTML=
    "Henüz ürün eklenmedi.";

    return;
  }

  area.innerHTML="";


  data.forEach(p=>{

    const div=
    document.createElement("div");

    div.className=
    "product "+
    (p.active ? "" : "off");


    const img=
    document.createElement("img");

    img.src=
    p.image_url ||
    "logo-mark.png";

    img.onerror=()=>{
      img.src="logo-mark.png";
    };


    const info=
    document.createElement("div");

    info.className="info";


    const title=
    document.createElement("h3");

    title.textContent=
    p.name || "";


    const detail=
    document.createElement("div");

    detail.textContent=
    (p.category || "")+
    " • "+
    Number(p.price || 0)+
    " ₺";


    const description=
    document.createElement("div");

    description.className=
    "description";

    description.textContent=
    p.description || "";


    info.appendChild(title);
    info.appendChild(detail);

    if(p.description){
      info.appendChild(description);
    }


    const actions=
    document.createElement("div");

    actions.className="actions";


    const up=
    document.createElement("button");

    up.className="move";
    up.textContent="↑";

    up.onclick=()=>{
      moveProduct(p.id,-1);
    };


    const down=
    document.createElement("button");

    down.className="move";
    down.textContent="↓";

    down.onclick=()=>{
      moveProduct(p.id,1);
    };


    const edit=
    document.createElement("button");

    edit.className="edit";
    edit.textContent="DÜZENLE";

    edit.onclick=()=>{
      editProduct(p);
    };


    const toggle=
    document.createElement("button");

    toggle.className="toggle";

    toggle.textContent=
    p.active
    ? "SATIŞTA"
    : "KAPALI";

    toggle.onclick=()=>{
      toggleProduct(
        p.id,
        !p.active
      );
    };


    const del=
    document.createElement("button");

    del.className="delete";
    del.textContent="SİL";

    del.onclick=()=>{
      deleteProduct(p.id);
    };


    actions.appendChild(up);
    actions.appendChild(down);
    actions.appendChild(edit);
    actions.appendChild(toggle);
    actions.appendChild(del);

    div.appendChild(img);
    div.appendChild(info);
    div.appendChild(actions);

    area.appendChild(div);

  });
}


async function addProduct(){

  const name=
  document
  .getElementById("name")
  .value
  .trim();

  const price=
  Number(
    document
    .getElementById("price")
    .value
  );

  const category=
  document
  .getElementById("category")
  .value;

  const description=
  document
  .getElementById("description")
  .value
  .trim();


  if(
    !name ||
    !price ||
    !category
  ){

    alert(
      "Ürün adı, fiyat ve kategori gir."
    );

    return;
  }


  const photoFile=
  document
  .getElementById("imageFile")
  ?.files[0];


  let imageUrl="";


  if(photoFile){

    const fileName=
    Date.now()+
    "-"+
    photoFile.name;


    const upload=
    await db.storage
    .from("product-images")
    .upload(
      fileName,
      photoFile
    );


    if(upload.error){

      alert(
        "Fotoğraf yüklenemedi: "+
        upload.error.message
      );

      return;
    }


    const publicData=
    db.storage
    .from("product-images")
    .getPublicUrl(fileName);


    imageUrl=
    publicData.data.publicUrl;
  }


  const {data:last}=await db
  .from("products")
  .select("sort_order")
  .order("sort_order",{
    ascending:false,
    nullsFirst:false
  })
  .limit(1);


  let nextOrder=1;


  if(
    last &&
    last.length &&
    last[0].sort_order!==null
  ){

    nextOrder=
    Number(
      last[0].sort_order
    )+1;
  }


  const result=
  await db
  .from("products")
  .insert({
    name:name,
    price:price,
    category:category,
    description:description,
    image_url:imageUrl,
    active:true,
    sort_order:nextOrder
  });


  if(result.error){

    alert(
      "Ürün eklenemedi: "+
      result.error.message
    );

    return;
  }


  document
  .getElementById("name")
  .value="";

  document
  .getElementById("price")
  .value="";

  document
  .getElementById("description")
  .value="";

  document
  .getElementById("imageFile")
  .value="";


  await loadProducts();
}


async function editProduct(p){

  const name=
  prompt(
    "Ürün adı",
    p.name || ""
  );

  if(
    name===null ||
    !name.trim()
  ){
    return;
  }


  const priceText=
  prompt(
    "Fiyat",
    Number(
      p.price || 0
    )
  );

  if(priceText===null){
    return;
  }

  const price=
  Number(priceText);

  if(!price){

    alert(
      "Geçerli fiyat gir."
    );

    return;
  }


  const category=
  prompt(
    "Kategori",
    p.category || ""
  );

  if(
    category===null ||
    !category.trim()
  ){
    return;
  }


  const description=
  prompt(
    "Ürün içeriği / açıklaması",
    p.description || ""
  );

  if(description===null){
    return;
  }


  const result=
  await db
  .from("products")
  .update({
    name:name.trim(),
    price:price,
    category:category.trim(),
    description:description.trim()
  })
  .eq("id",p.id);


  if(result.error){

    alert(
      "Ürün güncellenemedi: "+
      result.error.message
    );

    return;
  }


  await loadProducts();
}


async function moveProduct(id,direction){

  const {data,error}=await db
  .from("products")
  .select("id,sort_order")
  .order("sort_order",{
    ascending:true,
    nullsFirst:false
  })
  .order("id",{ascending:true});


  if(error){
    alert(error.message);
    return;
  }


  const items=
  (data||[]).map(
    (x,i)=>({
      id:x.id,
      sort_order:i+1
    })
  );


  const i=
  items.findIndex(
    x=>x.id===id
  );

  const j=i+direction;


  if(
    i<0 ||
    j<0 ||
    j>=items.length
  ){
    return;
  }


  const temp=items[i];
  items[i]=items[j];
  items[j]=temp;


  for(
    let k=0;
    k<items.length;
    k++
  ){

    const r=
    await db
    .from("products")
    .update({
      sort_order:k+1
    })
    .eq("id",items[k].id);


    if(r.error){

      alert(
        r.error.message
      );

      return;
    }
  }


  await loadProducts();
}


async function toggleProduct(
id,
active
){

  const result=
  await db
  .from("products")
  .update({
    active:active
  })
  .eq("id",id);


  if(result.error){

    alert(
      result.error.message
    );

    return;
  }


  await loadProducts();
}


async function deleteProduct(id){

  if(
    !confirm(
      "Bu ürünü silmek istiyor musun?"
    )
  ){
    return;
  }


  const result=
  await db
  .from("products")
  .delete()
  .eq("id",id);


  if(result.error){

    alert(
      result.error.message
    );

    return;
  }


  await loadProducts();
}


// =====================
// BAŞLAT
// =====================

async function start(){

  await loadStoreStatus();
  await loadCategories();
  await loadProducts();

}

start();

</script>

</body>
</html>
